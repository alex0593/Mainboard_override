# nexxus-api — API de nexxus chat, vhost preparado para el futuro (H01).
# Cuando el servicio exista: descomentar el proxy_pass y el bloque CORS.
server {
    listen 80;
    listen [::]:80;
    server_name nexxus-api.duckdns.org;

    root /var/www/nexxus-api;
    index index.html;

    location / {
        try_files $uri $uri/ =404;

        # Cuando el servicio exista: sustituir try_files por el proxy.
        # proxy_pass http://127.0.0.1:8080;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
        #
        # CORS: la web de la app es el único origen permitido.
        # add_header Access-Control-Allow-Origin "https://nexxxusapp.duckdns.org" always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        # if ($request_method = OPTIONS) {
        #     return 204;
        # }
    }

    access_log /var/log/nginx/nexxus-api.access.log;
    error_log /var/log/nginx/nexxus-api.error.log;
}
