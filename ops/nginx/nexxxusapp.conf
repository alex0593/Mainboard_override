# nexxxusapp — vhost preparado para el futuro (H01).
# Cuando la app exista: descomentar el proxy_pass y ajustar el puerto.
#
# HTTP: reto ACME + redirección permanente a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name nexxxusapp.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexxxusapp.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/mainboard-override.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mainboard-override.duckdns.org/privkey.pem;

    root /var/www/nexxxusapp;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # Proxy hacia el proceso de la app (cuando exista):
        # proxy_pass http://127.0.0.1:3000;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/nexxxusapp.access.log;
    error_log /var/log/nginx/nexxxusapp.error.log;
}
