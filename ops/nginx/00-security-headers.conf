# Cabeceras de seguridad para los tres vhosts (paridad con el Caddy de Serpy).
# Nivel http (como 00-ssl.conf): se heredan en los server blocks.
#
# OJO nginx: si un bloque inferior define su propio add_header, NO hereda los de
# arriba. Por eso mainboard-override.conf repite estas cabeceras en las locations
# de /downloads/ (que declaran su propio Cache-Control). Si añades otra location
# con add_header, repítelas también allí.
#
# HSTS pinnea el host en el navegador ~1 año; includeSubDomains solo afecta a
# subdominios de cada host (los tres vhosts son hermanos, no subdominios).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
