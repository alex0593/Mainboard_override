# Landing y descarga de Mainboard Override.
# Instalado por tools/deploy-site.sh en el servidor web (SSM).
server {
    listen 80;
    listen [::]:80;
    server_name mainboard-override.duckdns.org;

    root /var/www/mainboard-override;
    index index.html;

    # Descargas: latest.apk es un symlink que mueve tools/deploy-site.sh en
    # cada release (no tocar: el alias por versión obligaría a reescribir nginx).
    # El mapping de tipos va POR LOCALITY: a nivel server reemplazaría por
    # completo el mime.types heredado de http y rompería HTML/CSS/PNG.
    location = /downloads/latest.apk {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    location = /downloads/SHA256SUMS {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location /downloads/ {
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/mainboard-override.access.log;
    error_log /var/log/nginx/mainboard-override.error.log;
}
