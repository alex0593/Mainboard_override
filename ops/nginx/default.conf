# Hosts desconocidos contra esta IP: cortar la conexión (444).
# Certbot y los tres vhosts reales entran por sus server_name.
# Sin server_name: el nombre vacío + default_server captura lo no emparejado
# (evita el conflicto con el bloque de bienvenida de nginx.conf, server_name _).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
