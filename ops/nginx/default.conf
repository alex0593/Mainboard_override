# Hosts desconocidos contra esta IP: cortar la conexión (444 en HTTP) o
# rechazar el handshake TLS (443). Certbot y los tres vhosts reales entran
# por su server_name.
# Sin server_name: el nombre vacío + default_server captura lo no emparejado
# (evita el conflicto con el bloque de bienvenida de nginx.conf, server_name _).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

# ssl_reject_handshake on no exige certificado en el bloque: nginx corta el
# TLS antes de la negociación, equivalente al 444 del puerto 80.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
